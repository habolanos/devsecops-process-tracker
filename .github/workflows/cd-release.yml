# ============================================================================
# CD Release Pipeline - Semantic Versioning & Changelog
# Standards: Semantic Versioning 2.0.0, Conventional Commits
# ============================================================================

name: CD Release Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '24'

jobs:
  # ==========================================================================
  # Semantic Release (only runs if CI passed)
  # ==========================================================================
  release:
    name: 🚀 Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    outputs:
      new_release_published: ${{ steps.detect-release.outputs.new_release_published }}
      new_release_version: ${{ steps.detect-release.outputs.new_release_version }}
      new_release_major_version: ${{ steps.detect-release.outputs.new_release_major_version }}
      new_release_minor_version: ${{ steps.detect-release.outputs.new_release_minor_version }}
      new_release_patch_version: ${{ steps.detect-release.outputs.new_release_patch_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Get last tag before release
        id: last-tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last tag before release: $LAST_TAG"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install semantic-release plugins
        run: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@12 \
            @semantic-release/release-notes-generator@13 \
            conventional-changelog-conventionalcommits@7

      - name: Semantic Release
        id: semantic
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" == "true" ]; then
            npx semantic-release --dry-run
          else
            npx semantic-release
          fi

      - name: Detect new release
        id: detect-release
        run: |
          LAST_TAG_BEFORE="${{ steps.last-tag.outputs.last_tag }}"
          LAST_TAG_AFTER=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          echo "Tag before: $LAST_TAG_BEFORE"
          echo "Tag after: $LAST_TAG_AFTER"
          
          if [ "$LAST_TAG_BEFORE" != "$LAST_TAG_AFTER" ] && [ -n "$LAST_TAG_AFTER" ]; then
            echo "new_release_published=true" >> $GITHUB_OUTPUT
            echo "new_release_version=$LAST_TAG_AFTER" >> $GITHUB_OUTPUT
            # Extract version components
            VERSION=$LAST_TAG_AFTER
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            echo "new_release_major_version=$MAJOR" >> $GITHUB_OUTPUT
            echo "new_release_minor_version=$MINOR" >> $GITHUB_OUTPUT
            echo "new_release_patch_version=$PATCH" >> $GITHUB_OUTPUT
            echo "✅ New release detected: $VERSION"
          else
            echo "new_release_published=false" >> $GITHUB_OUTPUT
            echo "new_release_version=" >> $GITHUB_OUTPUT
            echo "new_release_major_version=" >> $GITHUB_OUTPUT
            echo "new_release_minor_version=" >> $GITHUB_OUTPUT
            echo "new_release_patch_version=" >> $GITHUB_OUTPUT
            echo "ℹ️ No new release published"
          fi

      - name: Debug Outputs
        run: |
          echo "Published: ${{ steps.detect-release.outputs.new_release_published }}"
          echo "Version: ${{ steps.detect-release.outputs.new_release_version }}"

      - name: Release Summary
        if: steps.detect-release.outputs.new_release_published == 'true'
        run: |
          echo "## 🎉 New Release Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** v${{ steps.detect-release.outputs.new_release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Type breakdown:**" >> $GITHUB_STEP_SUMMARY
          echo "- Major: ${{ steps.detect-release.outputs.new_release_major_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Minor: ${{ steps.detect-release.outputs.new_release_minor_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- Patch: ${{ steps.detect-release.outputs.new_release_patch_version }}" >> $GITHUB_STEP_SUMMARY

      - name: No Release
        if: steps.detect-release.outputs.new_release_published != 'true'
        run: |
          echo "## ℹ️ No Release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No new release was published. This usually means:" >> $GITHUB_STEP_SUMMARY
          echo "- No commits with release-triggering types (feat, fix, etc.)" >> $GITHUB_STEP_SUMMARY
          echo "- All commits since last release are non-releasable (chore, docs, etc.)" >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Trigger Docker Build
  # ==========================================================================
  trigger-docker:
    name: 🐳 Trigger Docker Build
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.new_release_published == 'true'
    steps:
      - name: Trigger Docker workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-docker-publish.yml',
              ref: 'master',
              inputs: {
                version: '${{ needs.release.outputs.new_release_version }}'
              }
            })
            
            console.log('Docker build triggered for version ${{ needs.release.outputs.new_release_version }}')
