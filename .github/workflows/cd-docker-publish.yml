# ============================================================================
# CD Docker Publish Pipeline - Build, Sign, SBOM & Push to Docker Hub
# Standards: OCI Image Spec, SLSA Level 3, Sigstore, CIS Docker Benchmark
# ============================================================================

name: CD Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_DOCKER: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-process-tracker
  IMAGE_NAME_GHCR: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================================================
  # Build, Scan & Push Multi-Architecture Image (Security-First Pipeline)
  # ==========================================================================
  build-and-push:
    name: 🐳 Build, Scan & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest_docker: ${{ steps.push.outputs.digest }}
      digest_ghcr: ${{ steps.push-ghcr.outputs.digest }}
      image_docker: ${{ env.IMAGE_NAME_DOCKER }}
      image_ghcr: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit timestamp
        id: commit_info
        run: |
          echo "timestamp=$(git log -1 --pretty=%ct)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +"%Y-%m-%dT%H:%M:%SZ" --date="@$(git log -1 --pretty=%ct)")" >> $GITHUB_OUTPUT

      - name: Set up QEMU (multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker Hub
        id: meta-docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_DOCKER }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=DevSecOps Process Tracker
            org.opencontainers.image.description=Web application for DevSecOps process management with evidence tracking
            org.opencontainers.image.vendor=Harold Adrian
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          tags: |
            type=raw,value=${{ github.event.inputs.version }}
            type=sha,prefix=sha-,enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=DevSecOps Process Tracker
            org.opencontainers.image.description=Web application for DevSecOps process management with evidence tracking
            org.opencontainers.image.vendor=Harold Adrian
            org.opencontainers.image.licenses=GPL-3.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      # Step 1: BUILD (local only, no push yet)
      - name: Build Docker image locally (amd64 only for scan)
        id: build-local
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME_DOCKER }}:scan
          labels: ${{ steps.meta-docker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.commit_info.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version }}

      # Step 2: SECURITY SCAN (before pushing) - BLOCKS if vulnerabilities found
      - name: 🔍 Security Scan Image (BLOCKING)
        id: security-scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_DOCKER }}:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'
          exit-code: '1'
          ignore-unfixed: false

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'cd-docker-publish / trivy-image'

      - name: Run Trivy (table output for logs - NON-BLOCKING)
        if: always()
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_DOCKER }}:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          ignore-unfixed: false

      # Step 3: LOGIN (before push)
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: PUSH (multi-arch, only after scan passes)
      - name: Push Docker image to Docker Hub
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-docker.outputs.tags }}
          labels: ${{ steps.meta-docker.outputs.labels }}
          cache-from: type=gha
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ steps.commit_info.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version }}

      - name: Push Docker image to GHCR
        id: push-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ steps.commit_info.outputs.date }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version }}

      - name: Export digest
        run: |
          echo "Image pushed with digest: ${{ steps.push.outputs.digest }}"
          echo "Docker Hub tags: ${{ steps.meta-docker.outputs.tags }}"
          echo "GHCR tags: ${{ steps.meta-ghcr.outputs.tags }}"
          echo "Input version: ${{ github.event.inputs.version }}"
          echo "Event name: ${{ github.event_name }}"

  # ==========================================================================
  # Sign Image with Cosign (Sigstore)
  # ==========================================================================
  sign:
    name: ✍️ Sign Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest_docker }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME_DOCKER }}@${DIGEST}
          echo "✅ Image signed successfully"

      - name: Verify signature
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest_docker }}
        run: |
          cosign verify ${{ env.IMAGE_NAME_DOCKER }}@${DIGEST} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" | jq
          echo "✅ Signature verified"

  # ==========================================================================
  # Generate SBOM (Software Bill of Materials)
  # ==========================================================================
  sbom:
    name: 📋 Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX format)
        run: |
          syft ${{ env.IMAGE_NAME_DOCKER }}@${{ needs.build-and-push.outputs.digest_docker }} \
            -o spdx-json=sbom-spdx.json \
            -o cyclonedx-json=sbom-cyclonedx.json
          echo "✅ SBOM generated in SPDX and CycloneDX formats"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # Generate Build Attestation (SLSA Level 3)
  # ==========================================================================
  attestation:
    name: 📜 Build Attestation
    runs-on: ubuntu-latest
    needs: [build-and-push, sign]
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate attestation for GHCR
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          subject-digest: ${{ needs.build-and-push.outputs.digest_ghcr }}
          push-to-registry: true

  # ==========================================================================
  # Cleanup Old GHCR Images (keep only latest)
  # ==========================================================================
  cleanup-ghcr:
    name: 🧹 Cleanup Old GHCR Images
    runs-on: ubuntu-latest
    needs: [build-and-push, attestation]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    permissions:
      packages: write
    steps:
      - name: Delete old GHCR package versions
        uses: actions/github-script@v7
        with:
          script: |
            const packageName = context.repo.repo; // Just 'devsecops-process-tracker', not 'owner/repo'
            const packageType = 'container';
            
            // Try user-owned package first, fall back to org-owned
            let versions;
            try {
              const { data } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByAuthenticatedUser({
                package_type: packageType,
                package_name: packageName,
                per_page: 100
              });
              versions = data;
              console.log('Using user-owned package API');
            } catch (userError) {
              console.log('User-owned API failed, trying org-owned...');
              try {
                const { data } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                  package_type: packageType,
                  package_name: packageName,
                  org: context.repo.owner,
                  per_page: 100
                });
                versions = data;
                console.log('Using org-owned package API');
              } catch (orgError) {
                console.error('Both APIs failed:', orgError.message);
                throw orgError;
              }
            }
            
            if (!versions || versions.length <= 1) {
              console.log('Only one or zero versions found, nothing to delete');
              return;
            }
            
            // Sort by created_at descending (newest first)
            versions.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            
            // Find the first version that has a semver tag (not sha-xxx)
            const semverVersion = versions.find(v => 
              v.metadata && v.metadata.container && v.metadata.container.tags &&
              v.metadata.container.tags.some(tag => /^\d+\.\d+\.\d+$/.test(tag))
            ) || versions[0];
            
            const versionsToDelete = versions.filter(v => v.id !== semverVersion.id);
            
            const semverTag = semverVersion.metadata?.container?.tags?.find(t => /^\d+\.\d+\.\d+$/.test(t)) || 'unknown';
            console.log(`Keeping version with semver tag: ${semverTag} (id: ${semverVersion.id})`);
            console.log(`Deleting ${versionsToDelete.length} old version(s)...`);
            
            for (const version of versionsToDelete) {
              try {
                // Try user delete first, fall back to org delete
                try {
                  await github.rest.packages.deletePackageVersionForAuthenticatedUser({
                    package_type: packageType,
                    package_name: packageName,
                    package_version_id: version.id
                  });
                } catch (userDeleteError) {
                  await github.rest.packages.deletePackageVersionForOrg({
                    package_type: packageType,
                    package_name: packageName,
                    org: context.repo.owner,
                    package_version_id: version.id
                  });
                }
                console.log(`✅ Deleted version ${version.id}`);
              } catch (error) {
                console.error(`❌ Failed to delete version ${version.id}: ${error.message}`);
              }
            }
            
            console.log('Cleanup complete!');

  # ==========================================================================
  # Update Docker Hub Repository Metadata
  # ==========================================================================
  update-dockerhub-metadata:
    name: 📝 Update Docker Hub Metadata
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      REPO_NAME: devsecops-process-tracker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update Docker Hub repository metadata
        run: |
          # Get JWT token
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"'${DOCKERHUB_USERNAME}'","password":"'${DOCKERHUB_TOKEN}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to get Docker Hub token"
            exit 1
          fi
          
          # Create full description from Docker-specific README (entire file, it's small enough)
          if [ -f "README.dockerhub.md" ]; then
            FULL_DESCRIPTION=$(cat README.dockerhub.md)
            echo "Using README.dockerhub.md for full description"
          else
            FULL_DESCRIPTION=$(head -c 10000 README.md)
            echo "Using truncated README.md for full description (README.dockerhub.md not found)"
          fi
          
          # Update repository description and overview
          echo "Updating Docker Hub repository description..."
          # Build payload with proper JSON encoding for full_description
          PAYLOAD=$(jq -n \
            --arg desc "Web application for DevSecOps process management with evidence tracking, dependencies, and exports" \
            --rawfile full_desc <(echo "$FULL_DESCRIPTION") \
            '{description: $desc, full_description: $full_desc}')
          
          RESPONSE=$(curl -s -X PATCH \
            -H "Authorization: JWT $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO_NAME}/")
          
          if echo "$RESPONSE" | jq -e '.name' > /dev/null 2>&1; then
            echo "✅ Description and overview updated"
          else
            echo "⚠️ Description update response: $RESPONSE"
          fi
          
          # Update categories - Note: Docker Hub API has limited support for categories
          echo ""
          echo "=== Docker Hub Categories ==="
          echo "Note: Docker Hub does not support setting categories via public API."
          echo "Categories must be configured manually in Docker Hub UI."
          echo ""
          echo "📋 To set categories manually:"
          echo "   1. Visit: https://hub.docker.com/repository/docker/${DOCKERHUB_USERNAME}/${REPO_NAME}/settings/categories"
          echo "   2. Select categories: Developer Tools, Security, DevOps"
          echo "   3. Click 'Save Changes'"
          echo ""

  # ==========================================================================
  # Cleanup Old Docker Hub Images (keep only latest)
  # ==========================================================================
  cleanup-dockerhub:
    name: 🧹 Cleanup Old Docker Hub Images
    runs-on: ubuntu-latest
    needs: [build-and-push, sign]
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      REPO_NAME: devsecops-process-tracker
    steps:
      - name: Delete old Docker Hub tags
        run: |
          # Get JWT token
          TOKEN=$(curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"username":"'${DOCKERHUB_USERNAME}'","password":"'${DOCKERHUB_TOKEN}'"}' \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "❌ Failed to get Docker Hub token"
            exit 1
          fi
          
          # Get all tags
          echo "Fetching tags from Docker Hub..."
          TAGS_RESPONSE=$(curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO_NAME}/tags?page_size=100")
          
          # Parse tags and identify semver vs sha tags
          echo "$TAGS_RESPONSE" | jq -r '.results[] | "\(.name)|\(.last_updated)"' > /tmp/tags_all.txt
          
          # Find semver tag (x.x.x format) to keep
          SEMVER_TAG=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+\|' /tmp/tags_all.txt | head -n1 | cut -d'|' -f1)
          
          if [ -z "$SEMVER_TAG" ]; then
            # Fallback to most recent if no semver found
            SEMVER_TAG=$(sort -t'|' -k2 -r /tmp/tags_all.txt | head -n1 | cut -d'|' -f1)
            echo "No semver tag found, keeping most recent: $SEMVER_TAG"
          else
            echo "Keeping semver tag: $SEMVER_TAG"
          fi
          
          # Get all tags except the one we're keeping
          TAGS_TO_DELETE=$(grep -v "^${SEMVER_TAG}|" /tmp/tags_all.txt | cut -d'|' -f1)
          
          TAG_COUNT=$(echo "$TAGS_TO_DELETE" | grep -c . || true)
          echo "Found $TAG_COUNT tag(s) to delete"
          
          if [ -z "$TAGS_TO_DELETE" ]; then
            echo "No tags to delete"
            exit 0
          fi
          
          # Delete all tags except the semver one
          echo "$TAGS_TO_DELETE" | while read -r tag_name; do
            [ -z "$tag_name" ] && continue
            echo "Deleting tag: $tag_name"
            DELETE_RESPONSE=$(curl -s -X DELETE \
              -H "Authorization: JWT $TOKEN" \
              "https://hub.docker.com/v2/repositories/${DOCKERHUB_USERNAME}/${REPO_NAME}/tags/${tag_name}/")
            
            if [ -z "$DELETE_RESPONSE" ]; then
              echo "✅ Deleted tag: $tag_name"
            else
              echo "⚠️ Delete response for $tag_name: $DELETE_RESPONSE"
            fi
          done
          
          echo "Docker Hub cleanup complete!"

  # ==========================================================================
  # Publish Summary
  # ==========================================================================
  summary:
    name: 📊 Publish Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, sign, sbom, attestation]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub** | `${{ env.IMAGE_NAME_DOCKER }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **GHCR** | `${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ needs.build-and-push.outputs.digest_docker }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security & Compliance" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build, Scan & Push | ${{ needs.build-and-push.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign Signature | ${{ needs.sign.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerability Scan | ✅ (integrated in build) |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA Attestation | ${{ needs.attestation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME_DOCKER }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
