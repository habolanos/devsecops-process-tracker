# ============================================================================
# Docker Publish Pipeline - Build, Sign, SBOM & Push to Docker Hub
# Standards: OCI Image Spec, SLSA Level 3, Sigstore, CIS Docker Benchmark
# ============================================================================

name: Docker Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: true
        default: 'latest'

env:
  REGISTRY_DOCKER: docker.io
  REGISTRY_GHCR: ghcr.io
  IMAGE_NAME_DOCKER: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-process-tracker
  IMAGE_NAME_GHCR: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Build & Push Multi-Architecture Image
  # ==========================================================================
  build-and-push:
    name: 🐳 Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    outputs:
      digest_docker: ${{ steps.push.outputs.digest }}
      digest_ghcr: ${{ steps.push-ghcr.outputs.digest }}
      image_docker: ${{ env.IMAGE_NAME_DOCKER }}
      image_ghcr: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker Hub
        id: meta-docker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME_DOCKER }}
          tags: |
            type=raw,value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.version || github.ref_name }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=DevSecOps Process Tracker
            org.opencontainers.image.description=Web application for DevSecOps process management with evidence tracking
            org.opencontainers.image.vendor=DevSecOps Team
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Extract metadata for GHCR
        id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          tags: |
            type=raw,value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{version}},value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.version || github.ref_name }}
            type=semver,pattern={{major}},value=${{ github.event.inputs.version || github.ref_name }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.title=DevSecOps Process Tracker
            org.opencontainers.image.description=Web application for DevSecOps process management with evidence tracking
            org.opencontainers.image.vendor=DevSecOps Team
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md

      - name: Build and push Docker image to Docker Hub
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-docker.outputs.tags }}
          labels: ${{ steps.meta-docker.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version || github.ref_name }}

      - name: Build and push Docker image to GHCR
        id: push-ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ github.event.inputs.version || github.ref_name }}

      - name: Export digest
        run: |
          echo "Image pushed with digest: ${{ steps.push.outputs.digest }}"
          echo "Docker Hub tags: ${{ steps.meta-docker.outputs.tags }}"
          echo "GHCR tags: ${{ steps.meta-ghcr.outputs.tags }}"

  # ==========================================================================
  # Sign Image with Cosign (Sigstore)
  # ==========================================================================
  sign:
    name: ✍️ Sign Image
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      - name: Sign the published Docker image
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest_docker }}
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign --yes ${{ env.IMAGE_NAME_DOCKER }}@${DIGEST}
          echo "✅ Image signed successfully"

      - name: Verify signature
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest_docker }}
        run: |
          cosign verify ${{ env.IMAGE_NAME_DOCKER }}@${DIGEST} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" | jq
          echo "✅ Signature verified"

  # ==========================================================================
  # Generate SBOM (Software Bill of Materials)
  # ==========================================================================
  sbom:
    name: 📋 Generate SBOM
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM (SPDX format)
        run: |
          syft ${{ env.IMAGE_NAME_DOCKER }}@${{ needs.build-and-push.outputs.digest_docker }} \
            -o spdx-json=sbom-spdx.json \
            -o cyclonedx-json=sbom-cyclonedx.json
          echo "✅ SBOM generated in SPDX and CycloneDX formats"

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom-spdx.json
            sbom-cyclonedx.json
          retention-days: 90

      - name: Attach SBOM to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom-spdx.json
            sbom-cyclonedx.json

  # ==========================================================================
  # Security Scan Published Image
  # ==========================================================================
  scan:
    name: 🔍 Security Scan
    runs-on: ubuntu-latest
    needs: [build-and-push]
    permissions:
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_DOCKER }}@${{ needs.build-and-push.outputs.digest_docker }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          vuln-type: 'os,library'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy (table output for summary)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME_DOCKER }}@${{ needs.build-and-push.outputs.digest_docker }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==========================================================================
  # Generate Build Attestation (SLSA Level 3)
  # ==========================================================================
  attestation:
    name: 📜 Build Attestation
    runs-on: ubuntu-latest
    needs: [build-and-push, sign]
    permissions:
      id-token: write
      attestations: write
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate attestation for GHCR
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}
          subject-digest: ${{ needs.build-and-push.outputs.digest_ghcr }}
          push-to-registry: true

  # ==========================================================================
  # Publish Summary
  # ==========================================================================
  summary:
    name: 📊 Publish Summary
    runs-on: ubuntu-latest
    needs: [build-and-push, sign, sbom, scan, attestation]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🐳 Docker Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Hub** | `${{ env.IMAGE_NAME_DOCKER }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **GHCR** | `${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ needs.build-and-push.outputs.digest_docker }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security & Compliance" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Push | ${{ needs.build-and-push.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cosign Signature | ${{ needs.sign.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{ needs.sbom.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Vulnerability Scan | ${{ needs.scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SLSA Attestation | ${{ needs.attestation.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.IMAGE_NAME_DOCKER }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY_GHCR }}/${{ env.IMAGE_NAME_GHCR }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
