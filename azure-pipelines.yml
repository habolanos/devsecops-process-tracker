# ============================================================================
# Azure DevOps Pipeline - DevSecOps Process Tracker
# Standards: ISO 27001, OWASP, CIS Benchmarks, SLSA Level 2
# ============================================================================

trigger:
  branches:
    include:
      - master
      - develop
      - QA
  paths:
    exclude:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
      - '*.txt'
      - '.vscode/**'
      - 'outcome/**'

pr:
  branches:
    include:
      - master
      - develop
      - QA

pool:
  vmImage: 'ubuntu-latest'

variables:
  nodeVersion: '24.x'
  npmCacheFolder: $(Pipeline.Workspace)/.npm
  workingDir: 'nextjs_space'

# ============================================================================
# Stage 1: Code Quality
# ============================================================================
stages:
  - quality
  - test
  - security
  - build
  - release
  - docker_publish

jobs:
  # ==========================================================================
  # Lint & Format
  # ==========================================================================
  - job: lint
    displayName: '🔍 Lint & Format'
    stage: quality
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | $(workingDir)/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npmCacheFolder)
        displayName: 'Cache npm'

      - script: |
          cd $(workingDir)
          npm ci --cache $(npmCacheFolder)
        displayName: 'Install dependencies'

      - script: |
          cd $(workingDir)
          npm run lint
        displayName: 'Run ESLint'

  # ==========================================================================
  # Commit Lint (PR only)
  # ==========================================================================
  - job: commitlint
    displayName: '📝 Commit Lint'
    stage: quality
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - script: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          npx commitlint --from $(git merge-base origin/$(System.PullRequest.TargetBranch) HEAD) --to HEAD --verbose
        displayName: 'Validate commits'

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  - job: unit_tests
    displayName: '🧪 Unit Tests'
    stage: test
    dependsOn: lint
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | $(workingDir)/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npmCacheFolder)
        displayName: 'Cache npm'

      - script: |
          cd $(workingDir)
          npm ci --cache $(npmCacheFolder)
        displayName: 'Install dependencies'

      - script: |
          cd $(workingDir)
          npm run test:coverage
        displayName: 'Run unit tests with coverage'

      - task: PublishTestResults@2
        inputs:
          testResultsFormat: 'JUnit'
          testResultsFiles: '$(workingDir)/test-results.xml'
          failTaskOnFailedTests: true
        condition: succeededOrFailed()
        displayName: 'Publish test results'

      - task: PublishCodeCoverageResults@1
        inputs:
          codeCoverageTool: 'Cobertura'
          summaryFileLocation: '$(System.DefaultWorkingDirectory)/$(workingDir)/coverage/cobertura-coverage.xml'
        condition: succeededOrFailed()
        displayName: 'Publish coverage'

  # ==========================================================================
  # E2E Tests
  # ==========================================================================
  - job: e2e_tests
    displayName: '🎭 E2E Tests'
    stage: test
    dependsOn: lint
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | $(workingDir)/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npmCacheFolder)
        displayName: 'Cache npm'

      - task: Cache@2
        inputs:
          key: 'playwright | "$(Agent.OS)" | $(workingDir)/package-lock.json'
          path: ~/.cache/ms-playwright
        displayName: 'Cache Playwright'

      - script: |
          cd $(workingDir)
          npm ci --cache $(npmCacheFolder)
        displayName: 'Install dependencies'

      - script: |
          cd $(workingDir)
          npx playwright install --with-deps chromium
        displayName: 'Install Playwright browsers'

      - script: |
          cd $(workingDir)
          npx playwright test --project=chromium
        displayName: 'Run E2E tests'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(workingDir)/playwright-report'
          artifact: 'playwright-report'
          publishLocation: 'pipeline'
        condition: always()
        displayName: 'Publish Playwright report'

  # ==========================================================================
  # Security - Dependency Audit
  # ==========================================================================
  - job: dependency_audit
    displayName: '🔐 Dependency Audit'
    stage: security
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - script: |
          cd $(workingDir)
          npm ci
        displayName: 'Install dependencies'

      - script: |
          cd $(workingDir)
          npm audit --audit-level=high
        displayName: 'Run npm audit'
        continueOnError: true

  # ==========================================================================
  # Security - CodeQL (SAST)
  # ==========================================================================
  - job: codeql
    displayName: '🛡️ CodeQL SAST'
    stage: security
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - script: |
          cd $(workingDir)
          npm ci
        displayName: 'Install dependencies'

      - task: AdvancedSecurity-Codeql-Init@1
        inputs:
          languages: 'javascript'
          queries: 'security-and-quality'
        displayName: 'Initialize CodeQL'

      - task: AdvancedSecurity-Codeql-Autobuild@1
        displayName: 'Autobuild'

      - task: AdvancedSecurity-Codeql-Analyze@1
        displayName: 'Analyze'

  # ==========================================================================
  # Build Application
  # ==========================================================================
  - job: build
    displayName: '🏗️ Build Application'
    stage: build
    dependsOn: 
      - unit_tests
      - e2e_tests
      - security
    condition: |
      and(
        succeeded(),
        or(
          eq(variables['Build.SourceBranch'], 'refs/heads/master'),
          eq(variables['Build.Reason'], 'PullRequest')
        )
      )
    steps:
      - task: NodeTool@0
        inputs:
          versionSpec: $(nodeVersion)
        displayName: 'Install Node.js'

      - task: Cache@2
        inputs:
          key: 'npm | "$(Agent.OS)" | $(workingDir)/package-lock.json'
          restoreKeys: |
            npm | "$(Agent.OS)"
          path: $(npmCacheFolder)
        displayName: 'Cache npm'

      - script: |
          cd $(workingDir)
          npm ci --cache $(npmCacheFolder)
        displayName: 'Install dependencies'

      - script: |
          cd $(workingDir)
          npm run build
        displayName: 'Build application'
        env:
          NODE_ENV: production

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(workingDir)/.next'
          artifact: 'nextjs-build'
          publishLocation: 'pipeline'
        displayName: 'Publish build artifacts'

  # ==========================================================================
  # Docker Build Test (PR only)
  # ==========================================================================
  - job: docker_test
    displayName: '🐳 Docker Build Test'
    stage: build
    dependsOn: build
    condition: eq(variables['Build.Reason'], 'PullRequest')
    steps:
      - task: Docker@2
        inputs:
          command: 'build'
          Dockerfile: 'Dockerfile'
          tags: 'devsecops-process-tracker:test'
          arguments: '--target runner'
        displayName: 'Build Docker image (test)'

  # ==========================================================================
  # Semantic Release (CD) - Only on master after CI passes
  # ==========================================================================
  - job: semantic_release
    displayName: '🚀 Semantic Release'
    stage: release
    dependsOn: build
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    steps:
      - checkout: self
        fetchDepth: 0
        persistCredentials: true

      - task: NodeTool@0
        inputs:
          versionSpec: '20.x'
        displayName: 'Install Node.js'

      - script: |
          npm install -g semantic-release@23 \
            @semantic-release/changelog@6 \
            @semantic-release/git@10 \
            @semantic-release/github@10 \
            @semantic-release/commit-analyzer@12 \
            @semantic-release/release-notes-generator@13 \
            conventional-changelog-conventionalcommits@7
        displayName: 'Install semantic-release'

      - script: |
          npx semantic-release
        displayName: 'Run semantic-release'
        env:
          GITHUB_TOKEN: $(GitHubToken)

  # ==========================================================================
  # Docker Publish (CD) - Only after release on master
  # ==========================================================================
  - deployment: docker_publish
    displayName: '🐳 Docker Publish'
    stage: docker_publish
    dependsOn: release
    condition: |
      and(
        succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/master'),
        ne(variables['Build.Reason'], 'PullRequest')
      )
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
            - download: current
              artifact: nextjs-build

            - task: Docker@2
              inputs:
                containerRegistry: 'DockerHub'
                repository: '$(DockerHub.Username)/devsecops-process-tracker'
                command: 'buildAndPush'
                Dockerfile: 'Dockerfile'
                tags: |
                  $(Build.BuildId)
                  latest
                  $(semanticReleaseVersion)
                arguments: '--platform linux/amd64,linux/arm64'
              displayName: 'Build & Push to Docker Hub'
              env:
                DOCKER_BUILDKIT: 1

            - script: |
                echo "Docker images published successfully"
                echo "Version: $(semanticReleaseVersion)"
              displayName: 'Publish summary'
