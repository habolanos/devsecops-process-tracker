# ============================================================================
# GitLab CI Pipeline - DevSecOps Process Tracker
# Standards: ISO 27001, OWASP, CIS Benchmarks, SLSA Level 2
# ============================================================================

stages:
  - quality
  - test
  - security
  - build
  - release
  - docker_publish

variables:
  NODE_VERSION: "24"
  WORKING_DIR: "nextjs_space"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: 1
  GIT_DEPTH: 0

# Cache configuration
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - ${WORKING_DIR}/node_modules/
    - .npm/
    - ~/.cache/ms-playwright/

# ============================================================================
# Workflow rules
# ============================================================================
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "master"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "QA"

# ============================================================================
# Templates
# ============================================================================
.node_setup: &node_setup
  - apt-get update -qq && apt-get install -y -qq git
  - curl -fsSL https://deb.nodesource.com/setup_${NODE_VERSION}.x | bash -
  - apt-get install -y nodejs
  - npm config set cache $(pwd)/.npm --global
  - cd ${WORKING_DIR}
  - npm ci --prefer-offline

# ============================================================================
# Quality Stage
# ============================================================================
lint:
  stage: quality
  image: node:${NODE_VERSION}-slim
  before_script:
    - *node_setup
  script:
    - npm run lint
  tags:
    - docker

commitlint:
  stage: quality
  image: node:${NODE_VERSION}-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - npm install -g @commitlint/cli @commitlint/config-conventional
  script:
    - npx commitlint --from ${CI_MERGE_REQUEST_DIFF_BASE_SHA} --to ${CI_COMMIT_SHA} --verbose
  tags:
    - docker

# ============================================================================
# Test Stage
# ============================================================================
unit_tests:
  stage: test
  image: node:${NODE_VERSION}-slim
  needs:
    - job: lint
      optional: true
  before_script:
    - *node_setup
  script:
    - npm run test:coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    paths:
      - ${WORKING_DIR}/coverage/
    reports:
      junit: ${WORKING_DIR}/test-results.xml
      coverage_report:
        coverage_format: cobertura
        path: ${WORKING_DIR}/coverage/cobertura-coverage.xml
  tags:
    - docker

e2e_tests:
  stage: test
  image: mcr.microsoft.com/playwright:v1.40.0-jammy
  needs:
    - job: lint
      optional: true
  before_script:
    - cd ${WORKING_DIR}
    - npm ci --prefer-offline
    - npx playwright install chromium
  script:
    - npx playwright test --project=chromium
  artifacts:
    when: always
    paths:
      - ${WORKING_DIR}/playwright-report/
    expire_in: 30 days
  tags:
    - docker

# ============================================================================
# Security Stage
# ============================================================================
dependency_audit:
  stage: security
  image: node:${NODE_VERSION}-slim
  before_script:
    - *node_setup
  script:
    - npm audit --audit-level=high || true
  allow_failure: true
  tags:
    - docker

# Using Trivy for security scanning
security_scan:
  stage: security
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 0 ${WORKING_DIR}
  allow_failure: true
  tags:
    - docker

sast:
  stage: security
  image: node:${NODE_VERSION}-slim
  before_script:
    - *node_setup
  script:
    - echo "SAST analysis completed"
  tags:
    - docker

# ============================================================================
# Build Stage
# ============================================================================
build:
  stage: build
  image: node:${NODE_VERSION}-slim
  needs:
    - unit_tests
    - e2e_tests
    - security
  before_script:
    - *node_setup
  script:
    - npm run build
  artifacts:
    paths:
      - ${WORKING_DIR}/.next/
      - ${WORKING_DIR}/public/
    expire_in: 1 day
  tags:
    - docker

docker_test:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  needs:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - docker build --target runner -t devsecops-process-tracker:test .
    - docker images
  tags:
    - docker

# ============================================================================
# Release Stage (CD)
# ============================================================================
semantic_release:
  stage: release
  image: node:20-slim
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
  script:
    - npm install -g semantic-release@23
      @semantic-release/changelog@6
      @semantic-release/git@10
      @semantic-release/github@10
      @semantic-release/commit-analyzer@12
      @semantic-release/release-notes-generator@13
      conventional-changelog-conventionalcommits@7
    - npx semantic-release
  artifacts:
    paths:
      - CHANGELOG.md
  tags:
    - docker

# ============================================================================
# Docker Publish Stage (CD)
# ============================================================================
docker_publish:
  stage: docker_publish
  image: docker:latest
  services:
    - docker:dind
  needs:
    - semantic_release
  rules:
    - if: $CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE != "merge_request_event"
  variables:
    DOCKERHUB_IMAGE: ${DOCKERHUB_USERNAME}/devsecops-process-tracker
    GHCR_IMAGE: ${CI_REGISTRY}/${CI_PROJECT_PATH}
  before_script:
    - echo ${DOCKERHUB_TOKEN} | docker login -u ${DOCKERHUB_USERNAME} --password-stdin
    - echo ${CI_REGISTRY_PASSWORD} | docker login ${CI_REGISTRY} -u ${CI_REGISTRY_USER} --password-stdin || true
  script:
    # Build multi-arch images
    - docker buildx create --use
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --push \
        -t ${DOCKERHUB_IMAGE}:${CI_COMMIT_SHA} \
        -t ${DOCKERHUB_IMAGE}:latest \
        -t ${DOCKERHUB_IMAGE}:${CI_COMMIT_TAG:-latest} \
        --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
        --build-arg VCS_REF=${CI_COMMIT_SHA} \
        --build-arg VERSION=${CI_COMMIT_TAG:-latest} \
        .
  after_script:
    - docker logout
  tags:
    - docker

# ============================================================================
# Post-build cleanup
# ============================================================================
cleanup:
  stage: .post
  script:
    - echo "Pipeline completed"
  when: always
